<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memories</title>

<style>
body {
    background-color: #ffea61;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
}

body::-webkit-scrollbar {
    display: none;
}

.memories {
    width: 90%;
    max-width: 600px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 10px; 
    gap: 8px;
    background-color: white;
    padding: 8px;
    border-radius: 10px;
}

#p3 {
    grid-column: span 2;
}

.memories img {
    width: 100%;
    display: block;
    border-radius: 10px;
}

.memories img:hover {
    transform: scale(1.05);
}

.memories img:active {
    transform: scale(0.95);
}



.popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}


.popup-box {
    background: white;
    padding: 20px 30px;
    border-radius: 15px;
    text-align: center;
    max-width: 300px;
    animation: pop 0.2s ease;
}

@keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.close {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 25px;
    color: white;
    cursor: pointer;
}

#popupimg {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    display: none;
}

</style>
</head>

<body>

<div class="popup" id="popup">

    <div class="popup-box">

        <p id="popupText"></p>
    </div>
</div>

<script>
const images = document.querySelectorAll(".memories img");
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");
const closeBtn = document.getElementById("closeBtn");

images.forEach(img => {
    img.addEventListener("click", () => {
        popupText.textContent = img.dataset.message;
        popup.style.display = "flex";
    });
});

closeBtn.addEventListener("click", () => {
    popup.style.display = "none";
});

popup.addEventListener("click", (e) => {
    if (e.target === popup) {
        popup.style.display = "none";
    }
});
function resizeGridItems() {
    const grid = document.querySelector(".memories");
    const rowHeight = parseInt(getComputedStyle(grid).getPropertyValue('grid-auto-rows'));
    const gap = parseInt(getComputedStyle(grid).getPropertyValue('gap'));

    grid.querySelectorAll("div").forEach(item => {
        const img = item.querySelector("img");
        const height = img.getBoundingClientRect().height;
        const rowSpan = Math.ceil((height + gap) / (rowHeight + gap));
        item.style.gridRowEnd = "span " + rowSpan;
    });
}


window.addEventListener("load", resizeGridItems);
window.addEventListener("resize", resizeGridItems);
</script>
