<style>
body {
    background-color: #ffea61;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
}

body::-webkit-scrollbar {
    display: none;
}

.memories {
    width: 90%;
    max-width: 600px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 5px; 
    gap: 8px;
    background-color: white;
    padding: 8px;
    border-radius: 10px;
}

#p3 {
    grid-column: span 2;    
}

#p3 img {
    height: 70px;
}

.memories img {
    width: 100%;
    display: block;
    border-radius: 10px;
    transition: transform 0.2s ease;
}

.memories img:hover {
    transform: scale(1.05);
}

.memories img:active {
    transform: scale(0.95);
}

.popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

@keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.close {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 25px;
    color: white;
    cursor: pointer;
}

#popupimg {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    display: none;
    cursor: zoom-in;
    transition: transform 0.3s ease;
}

#popupimg.zoomed {
    transform: scale(1);
    cursor: zoom-out;
    position: fixed;
    top: 0;
    left: 0;
}

.popup-box {
    background: white;
    padding: 20px 25px;
    border-radius: 15px;
    text-align: center;
    max-width: 300px;
    max-height: 80vh;   
    overflow-y: auto; 
    animation: pop 0.2s ease;
}

.popup-box::-webkit-scrollbar {
    display: none;
}

#p6 {

}
</style>

<div class="popup" id="popup">
    <div class="close" id="closeBtn">&times;</div>
    <div class="popup-box">
        <img id="popupimg" src="" alt="Popup Image">
        <p id="popupText"></p>
    </div>
</div>

<script>
const images = document.querySelectorAll(".memories img");
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");
const closeBtn = document.getElementById("closeBtn");
const popupImg = document.getElementById("popupimg");

images.forEach(img => {
    img.addEventListener("click", () => {
        popupText.textContent = img.dataset.message;

        if (img.dataset.image) {
            popupImg.src = img.dataset.image;
            popupImg.style.display = "block";

            popupImg.style.width = "";
            popupImg.style.height = "";

            if (img.dataset.style) {
                popupImg.style.cssText += img.dataset.style;
            }

        } else {
            popupImg.style.display = "none";
        }

        popup.style.display = "flex";
    });
});

function resizeGridItems() {
    const grid = document.querySelector(".memories");
    const rowHeight = parseInt(getComputedStyle(grid).getPropertyValue('grid-auto-rows'));
    const gap = parseInt(getComputedStyle(grid).getPropertyValue('gap'));

    grid.querySelectorAll(".memories div").forEach(item => {
        const img = item.querySelector("img");

        if (!img) return;

        const height = img.offsetHeight;
        const rowSpan = Math.ceil((height + gap) / (rowHeight + gap));

        item.style.gridRowEnd = "span " + rowSpan;
    });
}

window.addEventListener("load", () => {
    resizeGridItems();

    document.querySelectorAll("img").forEach(img => {
        img.addEventListener("load", resizeGridItems);
    });
});

window.addEventListener("resize", resizeGridItems);

popupImg.addEventListener("click", (e) => {
    e.stopPropagation();
    popupImg.classList.toggle("zoomed");
});

closeBtn.addEventListener("click", () => {
    popup.style.display = "none";
    popupImg.classList.remove("zoomed");
});

popup.addEventListener("click", (e) => {
    if (e.target === popup) {
        popup.style.display = "none";
        popupImg.classList.remove("zoomed");
    }
});
</script>
