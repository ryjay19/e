<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>Barbie Playlist Player</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--bg:#1a0f16;
--bg-elevated:#241522;
--surface:#2c1a29;
--surface-hover:#3a2135;
--accent:#ff3d92;
--accent-soft:#ffb6d9;
--text:#fbeef5;
--text-muted:#b98fa4;
--border:rgba(255,214,235,.08);
--shadow:0 12px 30px rgba(0,0,0,.35);
--radius-lg:18px;
--radius-md:12px;
--radius-sm:8px;
--sidebar-w:232px;
--nowplaying-w:280px;
--player-h:88px;
--topbar-h:64px;
}

*{
box-sizing:border-box;
min-width:0;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
background:
radial-gradient(1200px 700px at 15% -10%,#3a1330 0%,transparent 60%),
radial-gradient(900px 600px at 100% 0%,#431a34 0%,transparent 55%),
var(--bg);
color:var(--text);
font-family:'Manrope',system-ui,sans-serif;
-webkit-font-smoothing:antialiased;
overscroll-behavior:none;
}

button,input{
font-family:inherit;
}

button{
cursor:pointer;
}

img{
max-width:100%;
}

*::-webkit-scrollbar{
width:8px;
height:8px;
}

*::-webkit-scrollbar-track{
background:transparent;
}

*::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.14);
border-radius:8px;
}

/* APP */
.app{
display:grid;
width:100%;
height:100vh;
padding:8px;
gap:8px;
overflow:hidden;
grid-template-columns:minmax(0,var(--sidebar-w)) minmax(0,1fr) minmax(0,var(--nowplaying-w));
grid-template-rows:var(--topbar-h) minmax(0,1fr) var(--player-h);
grid-template-areas:
"top top top"
"side main queue"
"player player player";
}

/* TOPBAR */
.topbar{
grid-area:top;
display:flex;
align-items:center;
gap:14px;
padding:0 16px;
background:var(--bg-elevated);
border-radius:var(--radius-md);
overflow:hidden;
}

.brand{
display:flex;
align-items:center;
gap:8px;
font-family:'Baloo 2';
font-weight:800;
font-size:19px;
white-space:nowrap;
}

.brand .dot{
width:26px;
height:26px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),#ff8ec2);
display:flex;
align-items:center;
justify-content:center;
color:#3a0d24;
font-size:13px;
}

.menu-btn,
.queue-toggle{
background:none;
border:0;
color:var(--text);
border-radius:8px;
}

.menu-btn{
display:none;
font-size:20px;
padding:8px;
}

.searchwrap{
flex:1;
min-width:0;
max-width:420px;
display:flex;
align-items:center;
gap:10px;
background:var(--surface);
border-radius:999px;
padding:9px 16px;
border:1px solid transparent;
}

.searchwrap:focus-within{
border-color:var(--accent);
}

.searchwrap i{
color:var(--text-muted);
font-size:14px;
}

.searchwrap input{
width:100%;
background:none;
border:0;
outline:0;
color:var(--text);
font-size:14px;
}

.searchwrap input::placeholder{
color:var(--text-muted);
}

.topbar-spacer{
flex:1;
}

.spotify-login{
border:0;
background:#1ed760;
color:#071b0d;
font-weight:800;
font-size:11px;
padding:9px 13px;
border-radius:999px;
white-space:nowrap;
}

.spotify-login:hover{
filter:brightness(1.08);
}

.spotify-login.connected{
background:var(--surface);
color:var(--accent-soft);
border:1px solid var(--border);
}

.queue-toggle{
display:none;
width:38px;
height:38px;
background:var(--surface);
}

/* SIDEBAR */
.sidebar{
grid-area:side;
background:var(--bg-elevated);
border-radius:var(--radius-md);
padding:18px 12px;
display:flex;
flex-direction:column;
gap:6px;
overflow:auto;
}

.sidebar h4{
margin:6px 10px 10px;
font-size:11px;
letter-spacing:.4px;
color:var(--text-muted);
}

.sidebar-actions{
display:flex;
gap:6px;
margin:0 4px 8px;
}

.side-add{
flex:1;
border:0;
background:var(--accent);
color:#2c0a1c;
border-radius:8px;
padding:8px;
font-weight:800;
font-size:11px;
}

.drag-hint{
font-size:10px;
color:var(--text-muted);
padding:0 10px 5px;
line-height:1.35;
}

.pl-item{
position:relative;
display:flex;
align-items:center;
gap:9px;
padding:8px 7px;
border-radius:var(--radius-sm);
border:1px solid transparent;
user-select:none;
}

.pl-item:hover{
background:var(--surface-hover);
}

.pl-item.active{
background:var(--surface);
border-color:var(--border);
}

.pl-item img{
width:44px;
height:44px;
border-radius:8px;
object-fit:cover;
flex:none;
}

.pl-item .meta{
min-width:0;
overflow:hidden;
flex:1;
}

.pl-item .t{
font-size:13px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.pl-item .s{
font-size:11px;
color:var(--text-muted);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.pl-item.active .t{
color:var(--accent-soft);
}

.pl-tools{
display:flex;
align-items:center;
gap:2px;
opacity:.4;
}

.pl-item:hover .pl-tools,
.pl-item.active .pl-tools{
opacity:1;
}

.pl-tool{
width:25px;
height:25px;
border:0;
border-radius:6px;
background:transparent;
color:var(--text-muted);
font-size:10px;
}

.pl-tool:hover{
background:var(--surface-hover);
color:var(--text);
}

.pl-tool:disabled{
opacity:.2;
cursor:default;
}

.pl-tool.delete:hover{
color:#ff8cae;
}

/* MAIN */
.main{
grid-area:main;
background:var(--bg-elevated);
border-radius:var(--radius-lg);
overflow:auto;
position:relative;
}

.pl-hero{
display:flex;
align-items:flex-end;
gap:22px;
padding:34px 28px 22px;
background:linear-gradient(180deg,rgba(255,61,146,.22),transparent 85%);
}

.pl-hero img{
width:168px;
height:168px;
border-radius:12px;
object-fit:cover;
box-shadow:var(--shadow);
flex:none;
}

.pl-hero-meta{
min-width:0;
}

.kind{
font-size:12px;
font-weight:700;
color:var(--text-muted);
margin-bottom:6px;
}

.pl-hero-meta h1{
margin:0 0 12px;
font-family:'Baloo 2';
font-weight:800;
font-size:clamp(28px,4vw,46px);
line-height:1.02;
overflow-wrap:anywhere;
}

.sub{
font-size:13px;
color:var(--text-muted);
}

.sub strong{
color:var(--text);
}

/* ACTIONS */
.pl-actions{
display:flex;
align-items:center;
gap:12px;
padding:18px 28px 6px;
flex-wrap:wrap;
}

.play-big{
width:56px;
height:56px;
border-radius:50%;
border:0;
background:var(--accent);
color:#2c0a1c;
font-size:20px;
box-shadow:0 8px 20px rgba(255,61,146,.35);
}

.play-big:hover{
transform:scale(1.05);
}

.icon-btn{
background:none;
border:0;
color:var(--text-muted);
font-size:20px;
width:40px;
height:40px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.icon-btn:hover{
color:var(--text);
background:var(--surface-hover);
}

.icon-btn.on{
color:var(--accent);
}

.add-song{
border:1px solid var(--border);
background:var(--surface);
color:var(--text);
border-radius:999px;
padding:10px 14px;
font-size:12px;
font-weight:800;
}

.add-song:hover{
background:var(--surface-hover);
}

/* TRACKLIST */
.tracklist{
padding:10px 12px 26px;
}

.tl-head,
.track{
display:grid;
grid-template-columns:
40px
minmax(0,1fr)
80px
32px
32px
32px
40px;
gap:8px;
}

.tl-head{
padding:8px 16px;
font-size:11px;
color:var(--text-muted);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
background:var(--bg-elevated);
z-index:2;
}

.track{
align-items:center;
padding:9px 16px;
border-radius:var(--radius-sm);
}

.track:hover{
background:var(--surface-hover);
}

.track.playing{
background:var(--surface);
}

.track .idx{
color:var(--text-muted);
font-size:13px;
text-align:center;
}

.track .idx i{
display:none;
}

.track:hover .num{
display:none;
}

.track:hover .fa-play{
display:inline;
}

.track.playing .num,
.track.playing .fa-play{
display:none;
}

.track.playing .fa-volume-high{
display:inline;
color:var(--accent);
}

.track.playing:hover .fa-volume-high{
display:none;
}

.track.playing:hover .fa-pause{
display:inline;
}

.track-info{
overflow:hidden;
}

.tt{
font-size:14px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.track.playing .tt{
color:var(--accent-soft);
}

.ta{
font-size:12.5px;
color:var(--text-muted);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.dur{
font-size:12px;
color:var(--text-muted);
text-align:right;
}

.song-tools{
display:flex;
align-items:center;
justify-content:center;
gap:2px;
}

.song-tool{
width:28px;
height:28px;
border:0;
background:transparent;
color:var(--text-muted);
border-radius:6px;
font-size:9px;
}

.song-tool:hover{
background:var(--surface-hover);
color:var(--text);
}

.song-delete:hover{
color:#ff4d7d;
}

.song-tool:disabled{
opacity:.2;
cursor:default;
}

.like{
background:none;
border:0;
color:var(--text-muted);
font-size:15px;
opacity:0;
}

.track:hover .like,
.like.on{
opacity:1;
}

.like.on{
color:var(--accent);
}

.empty-state{
padding:40px 24px;
text-align:center;
color:var(--text-muted);
font-size:14px;
}

/* QUEUE */
.queue{
grid-area:queue;
background:var(--bg-elevated);
border-radius:var(--radius-lg);
padding:18px 16px;
overflow:auto;
display:flex;
flex-direction:column;
gap:16px;
}

.queue h3{
margin:0;
font-size:14px;
font-weight:800;
}

.queue-close{
display:none;
background:none;
border:0;
color:var(--text);
font-size:18px;
}

#videoBox{
position:relative;
width:100%;
aspect-ratio:1/1;
border-radius:var(--radius-md);
overflow:hidden;
background:var(--surface);
box-shadow:var(--shadow);
}

#nowPlayingImage{
width:100%;
height:100%;
object-fit:cover;
display:block;
cursor:pointer;
user-select:none;
-webkit-user-drag:none;
}

#youtubePlayer{
position:absolute;
inset:0;
width:100%;
height:100%;
display:none;
}

#youtubePlayer iframe{
width:100%!important;
height:100%!important;
border:0;
display:block;
}

.now-playing-description{
overflow:hidden;
}

.now-playing-description h2{
margin:0 0 4px;
font-size:16px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.description-artist{
margin:0 0 7px;
font-size:12px;
color:var(--accent-soft);
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.now-playing-description p:last-child{
margin:0;
font-size:12px;
line-height:1.5;
color:var(--text-muted);
}

.queue-list-label{
font-size:11px;
color:var(--text-muted);
font-weight:700;
margin-top:6px;
}

.queue-item{
display:flex;
align-items:center;
gap:10px;
padding:6px 4px;
border-radius:8px;
cursor:pointer;
}

.queue-item:hover{
background:var(--surface-hover);
}

.queue-item img{
width:34px;
height:34px;
border-radius:6px;
object-fit:cover;
flex:none;
}

.queue-item>div{
min-width:0;
}

.qt{
font-size:13px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.qa{
font-size:11.5px;
color:var(--text-muted);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* PLAYER */
.player{
grid-area:player;
background:var(--bg-elevated);
border-radius:var(--radius-md);
display:grid;
grid-template-columns:minmax(140px,260px) minmax(0,1fr) minmax(140px,200px);
align-items:center;
gap:16px;
padding:0 16px;
overflow:hidden;
}

.np-now{
display:flex;
align-items:center;
gap:12px;
min-width:0;
}

.np-now img{
width:52px;
height:52px;
border-radius:8px;
object-fit:cover;
}

.np-meta{
min-width:0;
overflow:hidden;
flex:1;
}

.np-meta .t{
font-size:13.5px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.np-meta .a{
font-size:12px;
color:var(--text-muted);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.np-like{
background:none;
border:0;
color:var(--text-muted);
font-size:14px;
}

.np-like.on{
color:var(--accent);
}

.np-center{
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
}

.np-controls{
display:flex;
align-items:center;
gap:18px;
}

.np-controls .icon-btn{
font-size:16px;
width:32px;
height:32px;
}

.np-play{
width:34px;
height:34px;
border-radius:50%;
border:0;
background:var(--text);
color:#2c0a1c;
font-size:14px;
}

.np-progress{
display:flex;
align-items:center;
gap:8px;
width:100%;
max-width:560px;
}

.np-progress span{
font-size:11px;
color:var(--text-muted);
width:36px;
text-align:center;
}

.seek{
width:100%;
height:4px;
accent-color:var(--accent);
cursor:pointer;
}

.np-right{
display:flex;
justify-content:flex-end;
}

/* MOBILE */
.overlay{
display:none;
}

@media(max-width:720px){
:root{
--sidebar-w:0px;
--player-h:128px;
--topbar-h:56px;
}

.app{
height:100dvh;
grid-template-columns:minmax(0,1fr);
grid-template-rows:var(--topbar-h) minmax(0,1fr) var(--player-h);
grid-template-areas:
"top"
"main"
"player";
gap:6px;
padding:6px;
padding-top:max(6px,env(safe-area-inset-top));
padding-left:max(6px,env(safe-area-inset-left));
padding-right:max(6px,env(safe-area-inset-right));
}

.topbar{
padding:0 6px 0 4px;
gap:6px;
}

.menu-btn{
display:flex;
align-items:center;
justify-content:center;
width:44px;
height:44px;
}

.brand{
flex:none;
}

.brand span:last-child{
display:none;
}

.brand .dot{
width:32px;
height:32px;
}

.searchwrap{
height:42px;
padding:0 12px;
max-width:none;
}

.searchwrap input{
font-size:16px;
}

.spotify-login{
font-size:0;
width:40px;
height:40px;
padding:0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.spotify-login i{
font-size:17px;
}

.queue-toggle{
display:flex;
align-items:center;
justify-content:center;
}

.sidebar{
position:fixed;
top:0;
left:0;
bottom:0;
width:min(290px,84vw);
z-index:40;
transform:translateX(-100%);
transition:.22s;
border-radius:0;
padding-top:max(18px,env(safe-area-inset-top));
}

.sidebar.open{
transform:translateX(0);
}

.main{
border-radius:14px;
}

.pl-hero{
flex-direction:column;
align-items:center;
text-align:center;
padding:22px 16px 12px;
gap:12px;
}

.pl-hero img{
width:min(58vw,210px);
height:min(58vw,210px);
}

.pl-hero-meta{
width:100%;
}

.pl-hero-meta h1{
font-size:28px;
margin-bottom:6px;
}

.pl-actions{
justify-content:center;
padding:8px 16px 4px;
}

.tracklist{
padding:4px 6px 20px;
}

.tl-head{
display:none;
}

.track{
grid-template-columns:
26px
minmax(0,1fr)
28px
28px
28px
44px;
gap:5px;
padding:10px 8px;
min-height:60px;
}

.dur{
display:none;
}

.track .like{
opacity:1;
width:44px;
height:44px;
}

.tt{
font-size:14.5px;
}

.ta{
font-size:12px;
}

.song-tool{
width:28px;
height:40px;
}

.queue{
position:fixed;
left:0;
right:0;
bottom:0;
top:auto;
width:100%;
height:88dvh;
max-height:88dvh;
z-index:40;
border-radius:22px 22px 0 0;
transform:translateY(100%);
transition:.25s;
padding:10px 18px calc(16px + env(safe-area-inset-bottom));
overflow:auto;
}

.queue.open{
transform:translateY(0);
}

.queue::before{
content:"";
display:block;
width:40px;
height:4px;
border-radius:4px;
background:rgba(255,255,255,.25);
margin:2px auto 4px;
}

.queue h3{
text-align:center;
}

.queue-close{
display:flex;
align-items:center;
justify-content:center;
position:absolute;
top:12px;
right:14px;
width:36px;
height:36px;
border-radius:50%;
background:var(--surface);
z-index:2;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:30;
}

.overlay.show{
display:block;
}

.player{
grid-template-columns:minmax(0,1fr);
grid-template-rows:auto auto;
padding:8px 10px calc(8px + env(safe-area-inset-bottom));
gap:6px;
}

.np-now{
gap:10px;
}

.np-now img{
width:46px;
height:46px;
}

.np-like{
margin-left:auto;
width:40px;
height:40px;
}

.np-center{
width:100%;
}

.np-controls{
width:100%;
justify-content:center;
gap:18px;
}

.np-controls .icon-btn{
width:44px;
height:44px;
font-size:17px;
}

.np-play{
width:50px;
height:50px;
}

.np-progress{
width:100%;
}

.np-right{
display:none;
}
}

@media(max-width:380px){
.app{
gap:4px;
padding:4px;
}

.topbar{
gap:4px;
}

.menu-btn{
width:40px;
height:40px;
}

.brand .dot{
width:30px;
height:30px;
}

.queue-toggle{
width:40px;
height:40px;
}

.searchwrap{
height:40px;
padding:0 9px;
}

.np-controls{
gap:10px;
}

.np-controls .icon-btn{
width:40px;
height:40px;
}

.np-play{
width:46px;
height:46px;
}

.track{
grid-template-columns:
24px
minmax(0,1fr)
26px
26px
26px
40px;
gap:3px;
padding-left:6px;
padding-right:6px;
}

.track .like{
width:40px;
height:40px;
}

.song-tool{
width:26px;
}
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<div class="app">

<!-- TOPBAR -->
<div class="topbar">

<button class="menu-btn" id="sidebarToggle" aria-label="Playlists">
<i class="fa-solid fa-bars"></i>
</button>

<div class="brand">
<span class="dot">
<i class="fa-solid fa-heart"></i>
</span>
<span>barbie fm</span>
</div>

<div class="searchwrap">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" id="searchInput" placeholder="Search this playlist...">
</div>

function loadJSON(key,fallback){

try{

const value=localStorage.getItem(key);

return value===null
?fallback
:JSON.parse(value);

}catch{

return fallback;

}

}

function createId(prefix="track"){

if(window.crypto&&crypto.randomUUID){

return crypto.randomUUID();

}

return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,9);

}

function escapeHTML(value){

return String(value??"").replace(
/[&<>"']/g,
char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);

}

function formatTime(sec){

if(!isFinite(sec)||sec==null){
return"0:00";
}

sec=Math.max(0,Math.floor(sec));

return Math.floor(sec/60)+":"+
String(sec%60).padStart(2,"0");

}

function isValidYoutubeId(id){

return typeof id==="string"&&
/^[A-Za-z0-9_-]{11}$/.test(id);

}


/* =========================================================
   SPOTIFY PKCE
   ========================================================= */

function base64UrlEncode(arrayBuffer){

return btoa(
String.fromCharCode(...new Uint8Array(arrayBuffer))
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=+$/,"");

}

function generateRandomString(length=64){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let result="";

const values=
crypto.getRandomValues(
new Uint8Array(length)
);

for(const value of values){

result+=chars[value%chars.length];

}

return result;

}

async function sha256(value){

const data=
new TextEncoder().encode(value);

return crypto.subtle.digest(
"SHA-256",
data
);

}

async function createCodeChallenge(verifier){

const digest=
await sha256(verifier);

return base64UrlEncode(digest);

}


/* =========================================================
   SPOTIFY LOGIN
   ========================================================= */

async function loginSpotify(){

if(!SPOTIFY_CLIENT_ID||
SPOTIFY_CLIENT_ID==="YOUR_SPOTIFY_CLIENT_ID"){

alert(
"Add your Spotify Client ID to SPOTIFY_CLIENT_ID first."
);

return;

}

const verifier=
generateRandomString(64);

const challenge=
await createCodeChallenge(verifier);

localStorage.setItem(
STORAGE.spotifyVerifier,
verifier
);

const params=new URLSearchParams({

client_id:SPOTIFY_CLIENT_ID,

response_type:"code",

redirect_uri:SPOTIFY_REDIRECT_URI,

code_challenge_method:"S256",

code_challenge:challenge,

scope:SPOTIFY_SCOPES

});

window.location.href=
"https://accounts.spotify.com/authorize?"+
params.toString();

}

async function handleSpotifyCallback(){

const params=
new URLSearchParams(
window.location.search
);

const code=params.get("code");

const error=params.get("error");

if(error){

console.warn(
"Spotify authorization error:",
error
);

return;

}

if(!code)return;

const verifier=
localStorage.getItem(
STORAGE.spotifyVerifier
);

if(!verifier)return;

try{

const body=new URLSearchParams({

client_id:SPOTIFY_CLIENT_ID,

grant_type:"authorization_code",

code:code,

redirect_uri:SPOTIFY_REDIRECT_URI,

code_verifier:verifier

});

const response=await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body
}
);

if(!response.ok){

throw new Error(
"Spotify token request failed"
);

}

const data=await response.json();

spotifyAccessToken=
data.access_token;

spotifyTokenExpiresAt=
Date.now()+
(data.expires_in*1000);

localStorage.setItem(
"barbieFM_spotify_token",
spotifyAccessToken
);

localStorage.setItem(
"barbieFM_spotify_expires",
String(spotifyTokenExpiresAt)
);

localStorage.removeItem(
STORAGE.spotifyVerifier
);

history.replaceState(
{},
document.title,
window.location.pathname
);

updateSpotifyButton();

}catch(error){

console.error(
"Spotify login failed:",
error
);

alert(
"Could not connect to Spotify."
);

}

}

function loadSpotifyToken(){

const token=
localStorage.getItem(
"barbieFM_spotify_token"
);

const expires=
Number(
localStorage.getItem(
"barbieFM_spotify_expires"
)
);

if(
token&&
expires&&
Date.now()<expires
){

spotifyAccessToken=token;
spotifyTokenExpiresAt=expires;

}

updateSpotifyButton();

}

function updateSpotifyButton(){

if(spotifyAccessToken){

el.spotifyLoginBtn.classList.add(

el.spotifyLoginBtn.innerHTML=

el.spotifyLoginBtn.innerHTML=
'<i class="fa-brands fa-spotify"></i>'+
'<span>Connect Spotify</span>';

}

}

async function spotifyRequest(endpoint){

if(!spotifyAccessToken){

throw new Error(
"Spotify is not connected."
);

}

if(
spotifyTokenExpiresAt&&
Date.now()>=spotifyTokenExpiresAt
){

spotifyAccessToken="";

localStorage.removeItem(
"barbieFM_spotify_token"
);

localStorage.removeItem(
"barbieFM_spotify_expires"
);

updateSpotifyButton();

throw new Error(
"Spotify login expired."
);

}

const response=await fetch(
"https://api.spotify.com/v1/"+endpoint,
{
headers:{
Authorization:
"Bearer "+spotifyAccessToken
}
}
);

if(response.status===401){

spotifyAccessToken="";

localStorage.removeItem(
"barbieFM_spotify_token"
);

localStorage.removeItem(
"barbieFM_spotify_expires"
);

updateSpotifyButton();

throw new Error(
"Spotify login expired."
);

}

if(!response.ok){

throw new Error(
"Spotify API error: "+response.status
);

}

return response.json();

}


/* =========================================================
   TRACK IDs
   ========================================================= */

function ensureTrackIds(){

Object.keys(playlists).forEach(pk=>{

if(!Array.isArray(playlists[pk].tracks)){
playlists[pk].tracks=[];
}

playlists[pk].tracks.forEach((tr,i)=>{

if(!tr.id){
tr.id=pk+"-track-"+(i+1);
}

if(typeof tr.duration!=="number"){
tr.duration=0;
}

if(!tr.durationLabel){
tr.durationLabel=
formatTime(tr.duration);
}

});

});

}


/* =========================================================
   TRACK MAP
   ========================================================= */

function getAllTrackMap(){

const map=new Map();

order.forEach(pk=>{

const pl=playlists[pk];

if(!pl)return;

pl.tracks.forEach((tr,index)=>{

map.set(
tr.id,
{
track:tr,
sourcePlaylistKey:pk,
sourceIndex:index
}
);

});

});

return map;

}

function normalizeLiked(){

const map=getAllTrackMap();

likedTracks=new Set(
[...likedTracks].filter(
id=>map.has(id)
)
);

likedOrder=
likedOrder.filter(
id=>likedTracks.has(id)
);

likedTracks.forEach(id=>{

if(!likedOrder.includes(id)){
likedOrder.push(id);
}

});

}

order=

)

STORAGE.liked,
[]
);

likedTracks=new Set(
Array.isArray(savedLiked)
?savedLiked
:[]
);

const savedLikedOrder=
loadJSON(
STORAGE.likedOrder,
[]
);

likedOrder=
Array.isArray(savedLikedOrder)
?savedLikedOrder
:[];

normalizeLiked();

const savedCurrent=
localStorage.getItem(
STORAGE.current
);

if(
savedCurrent==="liked"||
playlists[savedCurrent]
){

currentPlaylistKey=
savedCurrent;

}else{

currentPlaylistKey=
order[0]||"barbie";

}

saveState();

}

/* =========================================================
   SHUFFLE
   ========================================================= */

function buildShuffleOrder(
len,
excludeIndex
){

if(!len)return[];

const arr=[...Array(len).keys()]
.filter(i=>i!==excludeIndex);

for(
let i=arr.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()*(i+1)
);

[arr[i],arr[j]]=
[arr[j],arr[i]];

}

return excludeIndex==null
?arr
:[excludeIndex,...arr];

}


/* =========================================================
   SPOTIFY TRACK METADATA
   ========================================================= */

async function getSpotifyTrackData(
spotifyId
){

const data=
await spotifyRequest(
"tracks/"+encodeURIComponent(
spotifyId
)
);

return{

title:data.name||"Unknown song",

artist:
data.artists&&data.artists.length
?data.artists
.map(a=>a.name)
.join(", ")
:"Unknown artist",

duration:
Number(data.duration_ms)||0,

durationLabel:
formatTime(
Number(data.duration_ms)/1000
),

cover:
data.album&&
data.album.images&&
data.album.images.length
?data.album.images[0].url
:"",

album:
data.album?.name||""

};

}


/* =========================================================
   REFRESH SPOTIFY SONGS
   ========================================================= */

async function refreshSpotifyMetadata(){

if(!spotifyAccessToken){
return;
}

let changed=false;

for(const pk of order){

const pl=playlists[pk];

if(!pl)continue;

for(const tr of pl.tracks){

if(!tr.spotifyId)continue;

try{

const data=
await getSpotifyTrackData(
tr.spotifyId
);

tr.title=data.title;
tr.artist=data.artist;
tr.duration=data.duration;
tr.durationLabel=
data.durationLabel;

if(data.cover){
tr.cover=data.cover;
}

changed=true;

}catch(error){

console.warn(
"Could not refresh Spotify track:",
tr.spotifyId,
error
);

}

}

}

if(changed){

saveState();
renderAll();

}

}


/* =========================================================
   SPOTIFY ALBUM ARTWORK
   ========================================================= */

async function loadSpotifyAlbumCover(track){

if(!track){
return;
}

nowPlayingImage.src=
track.cover||
currentPlaylist().cover;

if(!track.spotifyId){
return;
}

if(track.cover){
return;
}

if(!spotifyAccessToken){
return;
}

try{

const data=
await getSpotifyTrackData(
track.spotifyId
);

if(data.cover){

track.cover=data.cover;

nowPlayingImage.src=
data.cover;

saveState();

}

}catch(error){

console.warn(
"Could not load Spotify artwork:",
error
);

}

}

function onYoutubeStateChange(event){

if(!youtubeReady)return;

switch(event.data){

case YT.PlayerState.PLAYING:

isPlaying=true;

saveCurrentYoutubeDuration();

updatePlayIcons();
updateTrackUI();

break;

case YT.PlayerState.PAUSED:

saveCurrentYoutubeDuration();

isPlaying=false;

updatePlayIcons();
updateTrackUI();

break;

case YT.PlayerState.ENDED:

saveCurrentYoutubeDuration();

isPlaying=false;

updatePlayIcons();

handleTrackEnded();

break;

}

}

function onYoutubeError(event){

console.error(
"YouTube error:",
event.data
);

isPlaying=false;

updatePlayIcons();

const errors={

2:"Invalid YouTube video ID.",

5:"The video cannot be played in the HTML5 player.",

100:"Video not found or removed.",

101:"The video owner does not allow embedded playback.",

150:"The video owner does not allow embedded playback."

};

console.error(
errors[event.data]||
"Unknown YouTube error."
);

}

if(
!ytPlayer||
!youtubeReady||
typeof ytPlayer.getDuration!=="function"
){

}

ytPlayer.getDuration();

if(!duration||duration<=0){

}

}

Math.abs(

)>1
){

formatTime(duration);

saveState();

renderTrackList();
renderHero();

}

/* =========================================================
   PLAYBACK
   ========================================================= */

function togglePlay(){

const track=currentTrack();

if(!track)return;

if(isPlaying){

if(
ytPlayer&&
typeof ytPlayer.pauseVideo==="function"
){

ytPlayer.pauseVideo();

}else{

isPlaying=false;
updatePlayIcons();

}

}else{

isPlaying=true;
updatePlayIcons();

playYoutube();

}

}

function handleTrackEnded(){

if(repeatMode===2){

playYoutube();

return;

}

nextTrack();

}

function nextTrack(){

const len=
currentPlaylist().tracks.length;

if(!len){

isPlaying=false;
showAlbum();
updatePlayIcons();

return;

}

if(isShuffle){

if(!shuffleOrder.length){

shuffleOrder=
buildShuffleOrder(
len,
currentIndex
);

}

const pos=
shuffleOrder.indexOf(
currentIndex
);

const nextPos=pos+1;

if(nextPos>=shuffleOrder.length){

if(repeatMode===0){

isPlaying=false;
showAlbum();
updatePlayIcons();

return;

}

shuffleOrder=
buildShuffleOrder(len,null);

currentIndex=
shuffleOrder[0];

}else{

currentIndex=
shuffleOrder[nextPos];

}

}else{

const next=
currentIndex+1;

if(
next>=len&&
repeatMode===0
){

isPlaying=false;
showAlbum();
updatePlayIcons();

return;

}

currentIndex=
next%len;

}

isPlaying=true;

saveState();
renderAll();
playYoutube();

}

function prevTrack(){

const len=
currentPlaylist().tracks.length;

if(!len)return;

if(
ytPlayer&&
youtubeReady&&
ytPlayer.getCurrentTime&&
ytPlayer.getCurrentTime()>3
){

ytPlayer.seekTo(0,true);

return;

}

if(
isShuffle&&
shuffleOrder.length
){

const pos=
shuffleOrder.indexOf(
currentIndex
);

const prevPos=
(pos-1+shuffleOrder.length)%
shuffleOrder.length;

currentIndex=
shuffleOrder[prevPos];

}else{

currentIndex=
(currentIndex-1+len)%len;

}

isPlaying=true;

saveState();
renderAll();
playYoutube();

}

if(
ytPlayer&&
youtubeReady&&
typeof ytPlayer.getCurrentTime==="function"
){

const current=
ytPlayer.getCurrentTime();

const duration=
ytPlayer.getDuration();

if(duration>0){

el.seekBar.value=
(current/duration)*100;

el.curTime.textContent=
formatTime(current);

el.durTime.textContent=
formatTime(duration);

updateSeekBackground();

saveCurrentYoutubeDuration();

}

}

requestAnimationFrame(
updateSeekBar
);

}

/* =========================================================
   ADD SONG
   ========================================================= */

async function addSong(){

if(currentPlaylistKey==="liked"){

alert(
"Open a normal playlist first. Liked Songs is generated automatically."
);

return;

}

const url=
prompt(
"Paste the Spotify or YouTube song link:"
);

if(!url||!url.trim()){
return;
}

const cleanUrl=
url.trim();

let spotifyId="";
let youtubeId="";

let title="Unknown song";
let artist="Unknown artist";

let cover="";
let duration=0;
let durationLabel="0:00";


/* SPOTIFY */

const spotifyMatch=
cleanUrl.match(
/open\.spotify\.com\/track\/([A-Za-z0-9]+)/
);

if(spotifyMatch){

spotifyId=
spotifyMatch[1];

if(!spotifyAccessToken){

const shouldLogin=
confirm(
"Connect Spotify first so the artist, album cover, and exact duration can be detected.\n\nConnect Spotify now?"
);

if(shouldLogin){

await loginSpotify();

return;

}

}else{

try{

const data=
await getSpotifyTrackData(
spotifyId
);

title=data.title;
artist=data.artist;
cover=data.cover;
duration=data.duration;
durationLabel=
data.durationLabel;

}catch(error){

console.error(
"Spotify metadata error:",
error
);

alert(
"Spotify information could not be loaded. Make sure Spotify is connected."
);

return;

}

}

}


/* YOUTUBE */

const youtubeMatch=
cleanUrl.match(
/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/
);

if(youtubeMatch){

youtubeId=
youtubeMatch[1];

const artistInput=
prompt(
"Artist name:"
);

if(artistInput&&artistInput.trim()){

artist=
artistInput.trim();

}

}


/* INVALID LINK */

if(!spotifyId&&!youtubeId){

alert(
"Please paste a valid Spotify or YouTube song link."
);

return;

}


/* CREATE SONG */

const track={

id:createId("track"),

title:title,

artist:artist,

description:"",

youtubeId:youtubeId,

spotifyId:spotifyId,

cover:cover,

duration:duration,

durationLabel:durationLabel

};

playlists[currentPlaylistKey]
.tracks
.push(track);

saveState();
renderAll();

alert(
`"${title}" was added to ${playlists[currentPlaylistKey].name}.`
);

}


/* =========================================================
   REMOVE SONG
   ========================================================= */

function removeSong(index){

const pl=currentPlaylist();

const tr=pl.tracks[index];

if(!tr)return;

if(currentPlaylistKey==="liked"){

toggleLike(tr);
return;

}

if(!confirm(
`Remove "${tr.title}" from ${pl.name}?`
)){
return;
}

const id=tr.id;

const playingId=
currentTrack()?.id;

pl.tracks.splice(
index,
1
);

likedTracks.delete(id);

likedOrder=
likedOrder.filter(
x=>x!==id
);

if(playingId===id){

if(
ytPlayer&&
typeof ytPlayer.stopVideo==="function"
){

try{
ytPlayer.stopVideo();
}catch{}

}

isPlaying=false;

currentIndex=
Math.min(
index,
Math.max(
0,
pl.tracks.length-1
)
);

}else if(
index<currentIndex
){

currentIndex--;

}

if(currentIndex<0){
currentIndex=0;
}

saveState();

renderAll();

}


/* =========================================================
   LIKE
   ========================================================= */

function toggleLike(track){

if(!track)return;

const id=track.id;

if(likedTracks.has(id)){

likedTracks.delete(id);

likedOrder=
likedOrder.filter(
x=>x!==id
);

}else{

likedTracks.add(id);

if(!likedOrder.includes(id)){

likedOrder.push(id);

}

}

normalizeLiked();

saveState();
renderAll();

}

/* =========================================================

   ========================================================= */

function getUpcomingIndices(count){

const len=
currentPlaylist().tracks.length;

if(!len)return[];

const result=[];

if(
isShuffle&&
shuffleOrder.length
){

const pos=
shuffleOrder.indexOf(
currentIndex
);

for(
let k=1;
k<=count&&
k<shuffleOrder.length;
k++
){

result.push(
shuffleOrder[
(pos+k)%shuffleOrder.length
]
);

}

}else{

for(
let k=1;
k<=count&&k<len;
k++
){

result.push(
(currentIndex+k)%len
);

}

}

return result;

}

renderQueue();

}


/* =========================================================
   REPEAT
   ========================================================= */

function cycleRepeat(){

repeatMode=
(repeatMode+1)%3;

el.repeatBtn.classList.toggle(
"on",
repeatMode!==0
);

if(repeatMode===2){

el.repeatBtn.innerHTML=`

<i class="fa-solid fa-repeat"></i>

<span
style="
position:absolute;
font-size:8px;
margin-left:14px;
margin-top:-14px;
"
>1</span>

`;

}else{

el.repeatBtn.innerHTML=
'<i class="fa-solid fa-repeat"></i>';

}

el.repeatBtn.style.position=
"relative";

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

el.spotifyLoginBtn.addEventListener(
"click",
loginSpotify
);

el.npLike.addEventListener(
"click",
()=>{

const tr=currentTrack();

if(tr){
toggleLike(tr);
}

}
);

el.playPauseBtn.addEventListener(
"click",
togglePlay
);

el.bigPlayBtn.addEventListener(
"click",
togglePlay
);

el.nextBtn.addEventListener(
"click",
nextTrack
);

el.prevBtn.addEventListener(
"click",
prevTrack
);

el.shuffleBtn.addEventListener(
"click",
toggleShuffle
);

el.shuffleAllBtn.addEventListener(
"click",
toggleShuffle
);

el.repeatBtn.addEventListener(
"click",
cycleRepeat
);

el.addPlaylistBtn.addEventListener(
"click",
addPlaylist
);

el.addSongBtn.addEventListener(
"click",
addSong
);


/* =========================================================
   ARTWORK CLICK
   ========================================================= */

nowPlayingImage.addEventListener(
"click",
()=>{

const tr=currentTrack();

if(
!tr||
!isValidYoutubeId(
tr.youtubeId
)
){

console.warn(
"This song does not have a valid YouTube video ID."
);

return;

}

loadYoutubeVideo();

});


/* =========================================================
   SEARCH
   ========================================================= */

el.searchInput.addEventListener(
"input",
event=>{

searchQuery=
event.target.value;

renderTrackList();

});


/* =========================================================
   MOBILE SIDEBAR
   ========================================================= */

function openSidebarMobile(){

el.sidebar.classList.add("open");

el.overlay.classList.add("show");

}

function closeSidebarMobile(){

el.sidebar.classList.remove("open");

if(
!el.queuePanel.classList.contains("open")
){

el.overlay.classList.remove("show");

}

}


/* =========================================================
   MOBILE QUEUE
   ========================================================= */

function openQueue(){

el.queuePanel.classList.add("open");

el.overlay.classList.add("show");

}

function closeQueue(){

el.queuePanel.classList.remove("open");

if(
!el.sidebar.classList.contains("open")
){

el.overlay.classList.remove("show");

}

}

el.sidebarToggle.addEventListener(
"click",
()=>{

el.sidebar.classList.contains("open")
?closeSidebarMobile()
:openSidebarMobile();

});

el.queueToggle.addEventListener(
"click",
()=>{

el.queuePanel.classList.contains("open")
?closeQueue()
:openQueue();

});

el.queueClose.addEventListener(
"click",
closeQueue
);

el.overlay.addEventListener(
"click",
()=>{

closeSidebarMobile();
closeQueue();

});


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
"keydown",
event=>{

if(
event.code==="Space"&&
document.activeElement!==el.searchInput
){

event.preventDefault();

togglePlay();

}

});


/* =========================================================
   START
   ========================================================= */

loadState();

loadSpotifyToken();

handleSpotifyCallback()
.then(()=>{

renderAll();

refreshSpotifyMetadata();

});

showAlbum();

updateSeekBackground();

updateSeekBar();

</script>

</body>
</html>
